<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Body Dissolution - Experiment 01</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      pointer-events: none;
      z-index: 100;
      line-height: 1.6;
    }

    #info .title {
      color: #00ff88;
      font-size: 14px;
      margin-bottom: 10px;
    }

    #info .stat {
      color: rgba(255, 255, 255, 0.4);
      font-size: 11px;
    }

    #info .state {
      color: #00ff88;
      margin-top: 10px;
    }

    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.3);
      font-size: 11px;
      text-align: center;
      pointer-events: none;
    }

    #controls .key {
      color: #00ff88;
      font-weight: bold;
    }

    #back {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
    }

    #back a {
      color: #00ff88;
      text-decoration: none;
      font-size: 12px;
      padding: 8px 12px;
      border: 1px solid rgba(0, 255, 136, 0.3);
      display: inline-block;
      transition: all 0.2s;
    }

    #back a:hover {
      background: rgba(0, 255, 136, 0.1);
      border-color: #00ff88;
    }
  </style>
</head>
<body>
  <div id="info">
    <div class="title">EXPERIMENT 01: PARTICLE BODY DISSOLUTION</div>
    <div class="stat">FPS: <span id="fps">--</span></div>
    <div class="stat">Particles: <span id="particles">--</span></div>
    <div class="state">State: <span id="state">--</span></div>
  </div>

  <div id="controls">
    <span class="key">MOUSE DRAG</span> Rotate ·
    <span class="key">SCROLL</span> Zoom ·
    <span class="key">SPACE</span> Pause
  </div>

  <div id="back">
    <a href="/">← Back to Index</a>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
